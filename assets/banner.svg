<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-label="Git Flow: The Release Train">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#052e16"/><stop offset="1" stop-color="#166534"/></linearGradient><radialGradient id="glow" cx=".85" cy=".5" r=".6"><stop offset="0" stop-color="#fb923c" stop-opacity=".28"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient></defs>
<rect width="1000" height="324" rx="18" fill="url(#bg)"/><rect width="1000" height="324" rx="18" fill="url(#glow)"/>
<circle cx="60" cy="40" r="3" fill="#fb923c" opacity=".7"><animate attributeName="opacity" values=".2;.9;.2" dur="3s" repeatCount="indefinite"/></circle>
<text x="48" y="64" font-size="14" letter-spacing="3" fill="#fb923c" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-weight="700">DEVOPS BOOTCAMP · LAB</text>
<text x="48" y="112" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Git Flow: The Release</text>
<text x="48" y="160" font-size="40" font-weight="800" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Train</text>
<text x="48" y="190" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Three teammates, one origin, a release on Friday and a bug on</text>
<text x="48" y="212" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">Saturday. Work like a team on a real branching model and keep history</text>
<text x="48" y="234" font-size="15" fill="#e2e8f0" opacity=".92" font-family="Segoe UI,Helvetica,Arial,sans-serif">clean.</text>
<rect x="48" y="266" width="105" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".7"/><text x="62" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">60-75 min</text>
<rect x="165" y="266" width="114" height="32" rx="16" fill="#ffffff" fill-opacity=".14" stroke="#fb923c" stroke-opacity=".7"/><text x="179" y="287" font-size="14" fill="#ffffff" font-family="Segoe UI,Helvetica,Arial,sans-serif">Cost: free</text>
<g transform="translate(750,62)">
<path d="M20 150 H200" stroke="#fb923c" stroke-width="5" stroke-linecap="round" stroke-dasharray="180" stroke-dashoffset="180"><animate attributeName="stroke-dashoffset" values="180;0;0;180" keyTimes="0;.4;.9;1" dur="6s" begin="-3s" repeatCount="indefinite"/></path>
<path d="M60 150 C80 110 90 90 110 90 H150 C170 90 180 130 190 150" fill="none" stroke="#a7f3d0" stroke-width="5" stroke-linecap="round" stroke-dasharray="200" stroke-dashoffset="200"><animate attributeName="stroke-dashoffset" values="200;200;0;0;200" keyTimes="0;.3;.65;.9;1" dur="6s" begin="-3.5s" repeatCount="indefinite"/></path>
<circle cx="20" cy="150" r="9" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-3.5s" repeatCount="indefinite"/></circle>
<circle cx="60" cy="150" r="9" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-2.9s" repeatCount="indefinite"/></circle>
<circle cx="110" cy="90" r="9" fill="#a7f3d0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-2.3s" repeatCount="indefinite"/></circle>
<circle cx="150" cy="90" r="9" fill="#a7f3d0" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-1.7s" repeatCount="indefinite"/></circle>
<circle cx="190" cy="150" r="9" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-1.1s" repeatCount="indefinite"/></circle>
<circle cx="200" cy="150" r="9" fill="#fb923c" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.2;.9;1" dur="6s" begin="-0.5s" repeatCount="indefinite"/></circle>
<text x="20" y="188" font-size="13" fill="#d1fae5" font-family="monospace">main</text><text x="105" y="76" font-size="13" fill="#d1fae5" font-family="monospace">feature</text>
</g>
